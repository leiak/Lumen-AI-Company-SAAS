# =============================================================================
# Portal reverse proxy — fronted at :80 inside the container (mapped to
# host :8080 via docker-compose). SPA history-mode fallback to index.html so
# Vue Router deep-links work on refresh.
#
# /api/** → gateway:9200 (Service Discovery via docker DNS)
# Everything else → static files from /usr/share/nginx/html
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for SPA assets — drops Vue chunk size by ~70%.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript application/wasm
               font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets, short-cache for index.html so deploys roll out.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API reverse-proxy to gateway service on the lumen-net bridge.
    location /api/ {
        proxy_pass http://lumen-gateway:9200/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Streaming uploads (file/chunk) need a longer read window.
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        client_max_body_size 200m;
    }

    # SPA fallback — anything not a real file goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
