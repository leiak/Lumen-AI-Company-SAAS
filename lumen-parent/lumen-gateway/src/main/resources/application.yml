###############################################################################
# Canary / Gray Routing Convention
#
# Operators control canary rollout through NACOS INSTANCE METADATA, not route
# config. Set `canary.weight` (0-100) on a single instance:
#
#   canary.weight=0   -> stable (default if absent)
#   canary.weight=20  -> 20% canary
#   canary.weight=100 -> full canary
#
# Per-request overrides use the X-Canary header:
#
#   X-Canary: gray    -> always pick a gray instance (fallback to stable if none)
#   X-Canary: stable  -> always pick a stable instance
#   (no header)       -> weighted random based on instance weights
#
# Downstream services receive `X-Canary-Gray: true|false` so they can shadow-log
# or branch behavior during a rollout.
#
# See docs/p2/canary.md for the operator runbook.
###############################################################################

server:
  port: 9200

spring:
  main:
    web-application-type: reactive
  profiles:
    active: dev
  application:
    name: lumen-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: lumen-public
        username: lumen
        password: lumen
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: platform-route
          uri: lb://platform-service
          predicates:
            - Path=/platform/**
        - id: system-route
          uri: lb://system-service
          predicates:
            - Path=/system/**
        - id: org-route
          uri: lb://org-service
          predicates:
            - Path=/org/**
        - id: workflow-route
          uri: lb://workflow-service
          predicates:
            - Path=/workflow/**
        - id: file-route
          uri: lb://file-service
          predicates:
            - Path=/file/**
        - id: message-route
          uri: lb://message-service
          predicates:
            - Path=/message/**
        # P4 business modules (10 routes added for hr/finance/assets/contract/
        # procurement/sales/payroll/inventory/bi/mobile)
        - id: hr-route
          uri: lb://hr-service
          predicates:
            - Path=/hr/**
        - id: finance-route
          uri: lb://finance-service
          predicates:
            - Path=/fin/**
        - id: assets-route
          uri: lb://assets-service
          predicates:
            - Path=/assets/**
        - id: contract-route
          uri: lb://contract-service
          predicates:
            - Path=/contract/**
        - id: procurement-route
          uri: lb://procurement-service
          predicates:
            - Path=/proc/**
        - id: sales-route
          uri: lb://sales-service
          predicates:
            - Path=/sal/**
        - id: payroll-route
          uri: lb://payroll-service
          predicates:
            - Path=/pay/**
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/inv/**
        - id: bi-route
          uri: lb://bi-service
          predicates:
            - Path=/bi/**
        - id: mobile-route
          uri: lb://mobile-service
          predicates:
            - Path=/mobile/**

        # ----------------------------------------------------------------------
        # Canary routes (commented — uncomment to opt-in to canary for a service).
        # Canary is enabled per-INSTANCE via Nacos metadata `canary.weight=N` on
        # the specific instance you want to receive gray traffic. No code change
        # is needed when adding or removing canary nodes; just set the metadata
        # in the Nacos console.
        #
        # Example: 10% canary on auth-service
        # - id: auth-route-canary
        #   uri: lb://auth-service   # same target — CanaryWeightFilter picks the instance
        #   predicates:
        #     - Path=/auth/**
        #
        # Multiple route ids for the same Path simply route to the same target.
        # The canary decision happens in CanaryWeightFilter regardless of which
        # route id matched, so adding a "-canary" route is documentation only.
        # ----------------------------------------------------------------------

lumen:
  security:
    crypto:
      key: ${LUMEN_CRYPTO_KEY:cYNI3uwR+n6jNWMs5TbN/0Jf0Glnr2cmVLfqe7uwZNo=}
    jwt:
      secret: ${LUMEN_JWT_SECRET:dev-only-please-override-in-production-this-is-not-secure-32bytes-minimum-required}
      issuer: lumen

logging:
  level:
    com.lumen: INFO
    org.springframework.cloud: WARN
    com.alibaba.cloud: WARN
    com.springframework.cloud.gateway.filter.CanaryWeightFilter: INFO