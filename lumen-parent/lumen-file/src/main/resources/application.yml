server:
  port: 9206
  tomcat:
    max-swallow-size: 100MB

spring:
  application:
    name: file-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lumen-public
        username: lumen
        password: lumen
  servlet:
    multipart:
      enabled: true
      # Hard servlet-level caps (defense in depth on top of service-level cap).
      max-file-size: 100MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/lumen_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false   # platform owns migrations
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lumen.file: debug
    org.springframework.cloud: WARN
    com.alibaba.cloud: WARN

lumen:
  security:
    crypto:
      key: ${LUMEN_CRYPTO_KEY:cYNI3uwR+n6jNWMs5TbN/0Jf0Glnr2cmVLfqe7uwZNo=}
    jwt:
      secret: ${LUMEN_JWT_SECRET:dev-only-please-override-in-production-with-a-real-256-bit-secret}
  storage:
    # Service-level caps.
    max-file-size: 104857600      # 100MB
    max-presigned-expiry-seconds: 86400   # 24h cap
    default-presigned-expiry-seconds: 3600   # 1h default
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: lumen
      # Set to false to disable auto-init when MinIO is unreachable in dev.
      auto-create-bucket: true
    # Content-type allow-list keyed by businessType. Null/empty businessType bypasses the check.
    content-type-allow-list:
      avatar:
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
      contract:
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      expense:
        - image/jpeg
        - image/png
        - application/pdf
