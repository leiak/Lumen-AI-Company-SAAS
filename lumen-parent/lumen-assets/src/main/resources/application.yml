server:
  port: 9210

spring:
  application:
    name: assets-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lumen-public
        username: lumen
        password: lumen
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/lumen_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false   # platform owns migrations
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lumen.assets: debug
    org.springframework.cloud: WARN
    com.alibaba.cloud: WARN

lumen:
  security:
    crypto:
      key: ${LUMEN_CRYPTO_KEY:cYNI3uwR+n6jNWMs5TbN/0Jf0Glnr2cmVLfqe7uwZNo=}
    jwt:
      secret: ${LUMEN_JWT_SECRET:dev-only-please-override-in-production-with-a-real-256-bit-secret}